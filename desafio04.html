<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04 - Formulário de Ordem de Serviço</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body style="background-color: #d1b9d1">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a href="index.html" class="navbar-brand fw-bold">SESI/SENAI DS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Início</a></li>
                    <li class="nav-item"><a href="desafio01.html" class="nav-link">Desafio 01</a></li>
                    <li class="nav-item"><a href="desafio02.html" class="nav-link">Desafio 02</a></li>
                    <li class="nav-item"><a href="desafio03.html" class="nav-link">Desafio 03</a></li>
                    <li class="nav-item"><a href="desafio04.html" class="nav-link active">Desafio 04</a></li>
                    <li class="nav-item"><a href="desafio05.html" class="nav-link">Desafio 05</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5" >
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6" >
                <div class="card shadow-sm p-4 border-0" style="background-color: #b499b4">
                    <h3 class="mb-4 fw-bold text-center">Cadastro de Ordem de Serviço</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold" >Nome</label>
                                <input type="text" class="form-control" placeholder="Maria" style="background-color: #f7e9f7" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold">Sobrenome</label>
                                <input type="text" class="form-control" placeholder="Silva" style="background-color: #f7e9f7" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-semibold">WhatsApp para Contato</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white text-dark">+55</span>
                                    <input type="text" class="form-control" placeholder="(41) 99999-9999" style="background-color: #f7e9f7" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Tipo de Serviço</label>
                                <select class="form-select" style="background-color: #f7e9f7" required>
                                    <option selected disabled value="">Escolha o serviço...</option>
                                    <option value="1">Formatação e Limpeza de Notebook</option>
                                    <option value="2">Troca de Tela / Hardware</option>
                                    <option value="3">Recuperação de Dados</option>
                                    <option value="4">Suporte em Redes</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Descrição do Problema / Observações</label>
                                <textarea class="form-control" rows="3" placeholder="Descreva os sintomas apresentados pelo equipamento..."></textarea>

                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="termos" style="background-color: #f7e9f7" required>
                                    <label for="termos" class="form-check-label text-muted">
                                        Estou ciente da taxa de orçamento e termos de garantia.
                                    </label>
                                </div>
                            </div>

                            <div class="col-12 mt-4">
                                <button class="btn btn-secondary w-100 py-2 "  style="background-color: #512a58" type="submit">Cadastrar Ordem de Serviço</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
